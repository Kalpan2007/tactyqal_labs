# Local Postgres for development. `docker compose up -d` then `npm run db:setup`.
services:
  db:
    image: postgres:17-alpine
    container_name: tactyqal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tactyqal
      POSTGRES_PASSWORD: tactyqal
      POSTGRES_DB: tactyqal
    ports:
      - "5433:5432"
    volumes:
      - tactyqal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactyqal -d tactyqal"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tactyqal-db-data:
